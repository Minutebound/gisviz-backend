services:

  # ────────────────────────────────────────────────────────
  # 1. Users DB
  # ────────────────────────────────────────────────────────
  users-db:
    image: postgres:15-alpine
    container_name: gisviz-users-db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER:     "${USERS_DB_USER}"
      POSTGRES_PASSWORD: "${USERS_DB_PASSWORD}"
      POSTGRES_DB:       "${USERS_DB_NAME}"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 2. Posts DB
  # ────────────────────────────────────────────────────────
  posts-db:
    image: postgres:15-alpine
    container_name: gisviz-posts-db
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER:     "${POSTS_DB_USER}"
      POSTGRES_PASSWORD: "${POSTS_DB_PASSWORD}"
      POSTGRES_DB:       "${POSTS_DB_NAME}"
    volumes:
      - posts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTS_DB_USER} -d ${POSTS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 3. Analytics DB
  # ────────────────────────────────────────────────────────
  analytics-db:
    image: postgres:15-alpine
    container_name: gisviz-analytics-db
    restart: always
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER:     "${ANALYTICS_DB_USER}"
      POSTGRES_PASSWORD: "${ANALYTICS_DB_PASSWORD}"
      POSTGRES_DB:       "${ANALYTICS_DB_NAME}"
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER} -d ${ANALYTICS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 4. Admin DB
  # ────────────────────────────────────────────────────────
  admin-db:
    image: postgres:15-alpine
    container_name: gisviz-admin-db
    restart: always
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER:     "${ADMIN_DB_USER}"
      POSTGRES_PASSWORD: "${ADMIN_DB_PASSWORD}"
      POSTGRES_DB:       "${ADMIN_DB_NAME}"
    volumes:
      - admin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ADMIN_DB_USER} -d ${ADMIN_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 5. Redis Cache
  # ────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: gisviz-cache
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 6. Redis Insight GUI
  # ────────────────────────────────────────────────────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: gisviz-redis-insight
    restart: always
    ports:
      - "8002:5540"
    volumes:
      - redis-insight-data:/data
    networks:
      - gisviz-network
    depends_on:
      - cache

  # ────────────────────────────────────────────────────────
  # 7. pgAdmin 4
  # ────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gisviz-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL:    "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
      PGADMIN_LISTEN_PORT:      "80"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      users-db:
        condition: service_healthy
      posts-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
      admin-db:
        condition: service_healthy
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 8. FastAPI backend
  # ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: gisviz-api
    restart: always
    env_file:
      - .env.backend
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - uploads-data:/app/uploads
    depends_on:
      users-db:
        condition: service_healthy
      posts-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
      admin-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - gisviz-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ────────────────────────────────────────────────────────
  # 9. Loki
  # ────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: gisviz-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 10. Promtail
  # ────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: gisviz-promtail
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - gisviz-network
    
  
networks:
  gisviz-network:
    name: gisviz-network
    driver: bridge

volumes:
  users-db-data:
    name: gisviz-users-db-data
  posts-db-data:
    name: gisviz-posts-db-data
  analytics-db-data:
    name: gisviz-analytics-db-data
  admin-db-data:
    name: gisviz-admin-db-data
  cache-data:
    name: gisviz-cache-data
  redis-insight-data:
    name: gisviz-redis-insight-data
  pgadmin-data:
    name: gisviz-pgadmin-data
  uploads-data:
    name: gisviz-uploads-data