services:

  # ────────────────────────────────────────────────────────
  # 1. Users DB  (PostgreSQL 15)
  # ────────────────────────────────────────────────────────
  users-db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    container_name: gisviz-users-db
    restart: always
    environment:
      POSTGRES_USER: "${USERS_DB_USER}"
      POSTGRES_PASSWORD: "${USERS_DB_PASSWORD}"
      POSTGRES_DB: "${USERS_DB_NAME}"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 2. Posts DB   (PostgreSQL 15)
  # ────────────────────────────────────────────────────────
  posts-db:
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    container_name: gisviz-posts-db
    restart: always
    environment:
      POSTGRES_USER: "${POSTS_DB_USER}"
      POSTGRES_PASSWORD: "${POSTS_DB_PASSWORD}"
      POSTGRES_DB: "${POSTS_DB_NAME}"
    volumes:
      - posts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTS_DB_USER} -d ${POSTS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 3. Redis Cache
  # ────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    container_name: gisviz-cache
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 4. Redis Insight (Cache GUI)
  # Access at http://localhost:8002
  # ────────────────────────────────────────────────────────
  redis-insight:
    image: redis/redisinsight:latest
    container_name: gisviz-redis-insight
    restart: always
    ports:
      - "8002:5540"
    volumes:
      - redis-insight-data:/data
    networks:
      - gisviz-network
    depends_on:
      - cache

  # ────────────────────────────────────────────────────────
  # 5. pgAdmin 4  — DB management GUI
  # Access at http://localhost:5050
  # ────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gisviz-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
      PGADMIN_LISTEN_PORT: "80"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      users-db:
        condition: service_healthy
      posts-db:
        condition: service_healthy
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 6. FastAPI backend
  # ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: gisviz-api
    restart: always
    env_file:
      - .env.backend
    ports:
      - "8001:8001"
    volumes:
      - ./app:/app/app
      - uploads-data:/app/uploads
    depends_on:
      users-db:
        condition: service_healthy
      posts-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - gisviz-network
    logging:
      driver: loki
      options:
        # Securely interpolated from the root .env file
        loki-url: "${LOKI_URL}"
        mode: "non-blocking"
        loki-retries: "2"
  
  # ────────────────────────────────────────────────────────
  # 7. Loki - Log Aggregation System
  # ────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: gisviz-loki
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 8. Promtail - Log Shipper
  # Scrapes Docker stdout logs and sends them to Loki
  # ────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: gisviz-promtail
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - gisviz-network

# ──────────────────────────────────────────────────────────
networks:
  gisviz-network:
    name: gisviz-network
    driver: bridge

volumes:
  users-db-data:
    name: gisviz-users-db-data
  posts-db-data:
    name: gisviz-posts-db-data
  cache-data:
    name: gisviz-cache-data
  redis-insight-data:
    name: gisviz-redis-insight-data
  pgadmin-data:
    name: gisviz-pgadmin-data
  uploads-data:
    name: gisviz-uploads-data