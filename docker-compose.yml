services:

  # ────────────────────────────────────────────────────────
  # 1. Users DB  (PostgreSQL 15)
  # Credentials injected from .env via Compose interpolation.
  # ────────────────────────────────────────────────────────
  users-db:
    image: postgres:15-alpine
    container_name: gisviz-users-db
    restart: always
    environment:
      POSTGRES_USER: "${USERS_DB_USER}"
      POSTGRES_PASSWORD: "${USERS_DB_PASSWORD}"
      POSTGRES_DB: "${USERS_DB_NAME}"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 2. Posts DB  (PostGIS 15-3.3)
  # ────────────────────────────────────────────────────────
  posts-db:
    image: postgres:15-alpine
    container_name: gisviz-posts-db
    restart: always
    environment:
      POSTGRES_USER: "${POSTS_DB_USER}"
      POSTGRES_PASSWORD: "${POSTS_DB_PASSWORD}"
      POSTGRES_DB: "${POSTS_DB_NAME}"
    volumes:
      - posts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTS_DB_USER} -d ${POSTS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 3. Redis Cache
  # ────────────────────────────────────────────────────────
  cache:
    image: redis:7-alpine
    container_name: gisviz-cache
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 4. pgAdmin 4  — DB management GUI
  # Access at http://localhost:5050
  # Login with PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD from .env
  # ────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gisviz-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD}"
      PGADMIN_LISTEN_PORT: "80"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      users-db:
        condition: service_healthy
      posts-db:
        condition: service_healthy
    networks:
      - gisviz-network

  # ────────────────────────────────────────────────────────
  # 5. FastAPI backend
  # All app config read from .env.backend at runtime.
  # ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      # CHANGE THIS TO 'dev' FOR LOCAL TESTING, OR 'prod' FOR IONOS DEPLOYMENT
      target: dev
    container_name: gisviz-api
    restart: always
    env_file:
      - .env.backend
    ports:
      - "8001:8001"
    volumes:
      # If using 'target: dev', uncomment the next line to mount your live code:
      - ./app:/app/app
      # This performs the actual mount of the uploads folder to persist images:
      - uploads-data:/app/uploads
    depends_on:
      users-db:
        condition: service_healthy
      posts-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - gisviz-network
  

# ──────────────────────────────────────────────────────────
networks:
  gisviz-network:
    name: gisviz-network
    driver: bridge

volumes:
  users-db-data:
    name: gisviz-users-db-data
  posts-db-data:
    name: gisviz-posts-db-data
  cache-data:
    name: gisviz-cache-data
  pgadmin-data:
    name: gisviz-pgadmin-data
  uploads-data:
    name: gisviz-uploads-data