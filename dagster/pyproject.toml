[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gisviz-dagster"
version = "0.1.0"
description = "Dagster pipeline for gisviz analytics ETL"
requires-python = ">=3.11"
# All Dagster sub-packages pinned to the SAME version to prevent the
# context-annotation validation drift that newer minor releases introduce.
dependencies = [
    "dagster==1.9.4",
    "dagster-webserver==1.9.4",
    "dagster-graphql==1.9.4",
    "dagster-pipes==1.9.4",
    "SQLAlchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.2",
    "pydantic-settings==2.2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gisviz_dagster*"]

[tool.dagster]
module_name = "gisviz_dagster"
attribute = "defs"