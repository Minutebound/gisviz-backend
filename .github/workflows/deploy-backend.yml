name: Deploy Backend to IONOS

on:
  push:
    branches:
      - deploy

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: SSH, Rebuild, and Migrate
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/gisviz/gisviz-backend
            
            # Pull the latest deploy branch
            git fetch origin deploy
            git reset --hard origin/deploy
            
            # Rebuild and restart the containers (Volumes/Data are preserved)
            docker compose down
            docker-compose up -d --build
            
            # Wait a few seconds to ensure the container is fully initialized
            sleep 5
            
            # Run Alembic migrations
            # NOTE: Replace 'api' with the exact name of your FastAPI service in docker-compose.yml
            docker-compose exec -T api alembic upgrade head