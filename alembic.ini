[alembic]
prepend_sys_path = .
script_location = alembic
# one migration history per database; datasets and misc are skipped when their URL is not set
databases = users, posts, analytics, admin, datasets, misc

[users]
sqlalchemy.url =

[posts]
sqlalchemy.url =

[analytics]
sqlalchemy.url =

[admin]
sqlalchemy.url =

[datasets]
sqlalchemy.url =

[misc]
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S